<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>输入区控件 · Flutter 实际截图</title><style>*{box-sizing:border-box}body{margin:0;background:#141414;color:#ececec;font:15px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:30px 20px}h1{font-size:23px;font-weight:550;margin:0 0 6px}p{color:#a5a5a5;margin:5px 0 20px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;color:#bcbcbc;background:#222;border:1px solid #444;padding:10px 17px;border-radius:24px;cursor:pointer;min-height:48px}button[aria-pressed=true]{background:#ececec;color:#141414;border-color:#ececec}.stage{display:flex;justify-content:center;min-height:500px;padding:24px 0}.stage img{max-width:100%;height:auto;border:1px solid #3a3a3a;border-radius:24px;box-shadow:0 18px 55px #0008}.note{font-size:13px}footer{color:#969696;font-size:13px;margin-top:24px}</style><main><h1>输入区控件 · 实际 Flutter 截图</h1><p>模型选择、系统文件选择、工具权限与局部玻璃面板，延续炭黑极简对话。</p><div class="bar" id="modes"><button data-mode="chat" aria-pressed="true">对话</button><button data-mode="attachment" aria-pressed="false">已选附件</button><button data-mode="models" aria-pressed="false">模型面板</button><button data-mode="permissions" aria-pressed="false">权限面板</button></div><div class="bar" id="widths"><button data-width="360" aria-pressed="false">360</button><button data-width="390" aria-pressed="false">390</button><button data-width="432" aria-pressed="true">432</button></div><p class="note" id="caption">432 × 960 · 真实渲染，点击上方切换截图。</p><div class="stage"><img id="screen" src="/files/composer-glass-432.png" width="432" height="960" alt="Flutter 输入区实际截图"></div><footer>26 项测试通过；静态分析无问题；Flutter Web release 构建通过。模型与工具权限目前为已标注的演示模式，Android APK 与真实引擎尚未验收。此页为截图画廊。</footer></main><script>let mode='chat',width='432';function update(){document.querySelector('#screen').src='/files/composer-glass-'+(mode==='chat'?width:mode)+'.png';document.querySelector('#screen').width=mode==='chat'?+width:432;document.querySelector('#caption').textContent=(mode==='chat'?width:432)+' × 960 · 实际 Flutter 截图';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelectorAll('[data-width]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.width===width));b.disabled=mode!=='chat'})}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;update()});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=b.dataset.width;update()});</script></html>
