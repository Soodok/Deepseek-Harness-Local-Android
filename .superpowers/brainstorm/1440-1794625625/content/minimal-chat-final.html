<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 极简对话 · 真实截图</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#ececec;font:14px/1.7 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:30px 18px}h1{font-size:26px;margin:0 0 8px}p{color:#aaa;margin:0 0 20px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}button{font:inherit;border:1px solid #444;background:#222;color:#ddd;border-radius:22px;padding:8px 18px;cursor:pointer}button[aria-pressed=true]{background:#eee;color:#141414}section{display:flex;justify-content:center;align-items:flex-start;gap:24px;flex-wrap:wrap}figure{margin:0;max-width:100%}figcaption{margin-bottom:8px;color:#aaa}img{display:block;width:100%;max-width:432px;height:auto;border:1px solid #353535;border-radius:16px}small{display:block;color:#999;margin-top:18px}button:focus-visible{outline:2px solid white;outline-offset:4px}</style><main><h1>DSH · 极简对话</h1><p>当前 Flutter 实现的真实字体截图。点击宽度切换；右侧为真实点按发送后的演示审批状态。</p><nav aria-label="截图宽度"><button data-w="432" aria-pressed="true">432px</button><button data-w="390" aria-pressed="false">390px</button><button data-w="360" aria-pressed="false">360px</button></nav><section><figure><figcaption id="size">对话 · 432 × 960</figcaption><img id="shot" src="/files/minimal-chat-final-432.png" width="432" height="960" alt="极简对话真实截图"></figure><figure><figcaption>发送后 · 工具与审批</figcaption><img src="/files/minimal-chat-final-action.png" width="432" height="960" alt="输入并发送后出现独立消息气泡和审批卡"></figure></section><small>此页展示真实 Flutter Web 截图，图片本身不可操作。数据为 fixture 演示；尚未验证 Android APK 和真实引擎接入。</small></main><script>document.querySelectorAll('button[data-w]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-w]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));let w=b.dataset.w;let img=document.querySelector('#shot');img.src='/files/minimal-chat-final-'+w+'.png';img.style.maxWidth=w+'px';img.width=Number(w);document.querySelector('#size').textContent='对话 · '+w+' × 960';});</script></html>
