name: android-build

# dsh-android 构建流水线
# v1.2.120 · 2026-10-13 — 全量触发 + 结果监视
#
# 双架构矩阵（arm64-v8a 真机 / x86_64 模拟器）：
#   build-hardssh-plugin —— 从 GitHub 固定 ref 拉取 @tiphareth/dsh-hardssh 源码并构建
#   collect-runtime —— 从 Termux 仓库收集对应架构 node 运行时 + 注入内置 SSH 插件 → runtime.zip
#   build-apk       —— 注入 runtime.zip 进 assets → gradle -Pabi=... 出 APK
#   release         —— 构建成功后，双架构 APK 自动发到本仓库 Releases（v1.2.120）
#   build-monitor   —— 汇总各 legs 结果到 Step Summary，任一失败即整红
#
# 监视（v1.2.120）：每次 push / PR / dispatch / 定时都跑，build-monitor 汇总
# 两只 legs 的结果写入 Step Summary，失败即整红；Gradle 日志按需留存 7 天。
# 注意：collect-runtime 脚本包名已对照 Termux Packages 索引核实过。
# ⚠️ Fork 本仓库后 GitHub 会把本 workflow 置为 disabled_fork：
#    需在 Actions → android-build 页面点一次 “Enable workflow” 才会运行。
# 触发一览：push(任意分支/tag v*) · pull_request(任意目标分支) · 每日 01:30 Asia/Shanghai · 手动 dispatch

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "30 17 * * *"   #  nightly · 01:30 Asia/Shanghai
  workflow_dispatch:

env:
  # 内置 SSH 远程工作区插件：源码不在本仓库，构建时从 GitHub 按固定提交拉取。
  # 升级插件 = 改 HARDSSH_REF（commit SHA 最稳；也接受 tag/分支），其余步骤不用动。
  # 2026-10-25：v0.2.10 —— 本地目录弹窗按 DSH 设计语言重绘（路径输入组 / 快捷入口
  # 胶囊 / 面包屑 / 线性图标 / 固定底栏），并新增「新建文件夹」（内核
  # createDirectory 接缝，成功后重列目录并高亮）。仍在 0.2.9 的 Android browse
  # 本地选择 + 私钥导入/生成之上（入口加载修复 26be03b：ssh2 的 CJS utils 改为
  # 默认导入）。构建末尾会用原生 Node import lib/index.js 作为闸门。
  # 上游合入后可改回 tiphareth0/dsh-hardssh。
  HARDSSH_REPO: XiaoPb/dsh-hardssh
  HARDSSH_REF: c7e2bd1e8ae8814d9041d2081fc794fb54aee992

permissions:
  contents: read   # release 段仍注释；启用时在该 job 内单独提权

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main 上新 push 取代旧构建，避免并发的 edge 发布互相覆盖（最新提交最终生效）；
  # tag 构建不互相取消，避免半个正式发布。
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # 内置 SSH 远程工作区插件（@tiphareth/dsh-hardssh）
  #
  # 设计约束（用户要求）：插件源码不进入本仓库 —— CI 在构建时从 GitHub 拉取
  # 固定 ref，构建产物只以 runtime.zip 内文件的形式进入 APK。
  # 纯 JS 包（ssh2/ws 也是纯 JS），与 ABI 无关，因此只构建一次，两个架构复用。
  # ---------------------------------------------------------------------------
  build-hardssh-plugin:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出本仓库（打包脚本）
        uses: actions/checkout@v4

      - name: 拉取插件源码 ${{ env.HARDSSH_REPO }}@${{ env.HARDSSH_REF }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HARDSSH_REPO }}
          ref: ${{ env.HARDSSH_REF }}
          path: hardssh-src

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 pnpm（与插件仓库 packageManager 对齐）
        run: |
          npm install -g pnpm@11.24.0
          pnpm --version

      - name: 构建插件
        working-directory: hardssh-src
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @tiphareth/dsh-hardssh build

      - name: 组装 runtime 部署单元
        env:
          HARDSSH_PLUGIN_REF: ${{ env.HARDSSH_REF }}
        run: |
          chmod +x scripts/pack-hardssh-plugin.sh
          ./scripts/pack-hardssh-plugin.sh hardssh-src/packages/dsh-hardssh hardssh-plugin
          tar -czf hardssh-plugin.tar.gz -C hardssh-plugin .

      - uses: actions/upload-artifact@v4
        with:
          name: hardssh-plugin
          path: hardssh-plugin.tar.gz
          retention-days: 1

  collect-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
          - termux_arch: x86_64
            abi: x86_64
    runs-on: ubuntu-24.04
    needs: [build-hardssh-plugin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hardssh-plugin
          path: .

      - name: 解包内置 SSH 插件
        run: |
          mkdir -p hardssh-plugin
          tar -xzf hardssh-plugin.tar.gz -C hardssh-plugin

      - name: 收集 Termux Node 运行时（${{ matrix.termux_arch }}）
        env:
          HARDSSH_PLUGIN_DIR: ${{ github.workspace }}/hardssh-plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt dpkg-dev zip
          chmod +x scripts/collect-termux-runtime.sh
          ./scripts/collect-termux-runtime.sh runtime.zip ${{ matrix.termux_arch }}

      - name: 校验运行时命令闭包（${{ matrix.abi }}）
        run: |
          rm -rf runtime-check && mkdir runtime-check
          unzip -q runtime.zip -d runtime-check
          test -x runtime-check/bin/bash
          test -x runtime-check/bin/rg
          # SONAME 精确文件名（Android linker 按 NEEDED 逐字查找）
          for so in libreadline.so.8 libhistory.so.8 libncursesw.so.6 libncurses.so.6 \
                    libiconv.so libpcre2-8.so; do
            test -e "runtime-check/lib/$so" || { echo "::error::SONAME 库 lib/$so 缺失"; exit 1; }
          done
          # 工具 wrapper（m1.6.8 真机验证版）
          test -x runtime-check/bin/pnpm
          test -x runtime-check/bin/curl
          test -e runtime-check/usr/bin/.keep
          # ripgrep 平台包（android resolver 的 require.resolve 目标）
          case "${{ matrix.termux_arch }}" in
            aarch64) NA=arm64 ;; x86_64) NA=x64 ;;
          esac
          test -x "runtime-check/lib/node_modules/@vscode/ripgrep-android-$NA/bin/rg" \
            || { echo "::error::ripgrep 平台包缺失"; exit 1; }
          if find runtime-check -type f -path '*@vscode/ripgrep-linux-*/*/rg' -print -quit | grep -q .; then
            echo "::error::runtime 混入宿主 Linux ripgrep"
            exit 1
          fi
          # 内置 SSH 远程工作区插件（@tiphareth/dsh-hardssh）：宿主代码 + 浏览器
          # bundle + 自己的 patch 层 + 两个第三方依赖都必须在包里；App 侧依赖
          # 这些固定路径启用插件，缺一个就静默失去 SSH 能力，因此在 CI 挡住。
          SSH_PKG=runtime-check/lib/node_modules/@tiphareth/dsh-hardssh
          for f in lib/index.js lib/fs.js lib/subprocess.js lib/client.js \
                   cordis.patch.yml node_modules/ssh2/package.json node_modules/ws/package.json; do
            test -f "$SSH_PKG/$f" || { echo "::error::内置 SSH 插件缺少 $f"; exit 1; }
          done
          if find "$SSH_PKG" -type l -print -quit | grep -q .; then
            echo "::error::内置 SSH 插件含符号链接（Android 侧要求实体文件）"
            exit 1
          fi
          echo "bash/rg/SONAME/wrapper + 内置 SSH 插件 runtime closure OK"

      - name: 计算校验值
        id: meta
        run: |
          echo "sha256=$(sha256sum runtime.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s runtime.zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: runtime.zip
          retention-days: 1

  build-apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
          - termux_arch: x86_64
            abi: x86_64
    runs-on: ubuntu-24.04
    needs: [collect-runtime]
    # 正式签名材料（v1.4.18）：GitHub Secrets 注入为环境变量，供下方解码/构建步骤使用。
    # 未配置时为空字符串 → 只构建 debug；tag 构建会被「tag 构建必须有 release 签名」拦下。
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 解码 release keystore（配置了签名 secret 时）
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/dsh-release.keystore
          chmod 600 keystore/dsh-release.keystore
          echo "release keystore ready: $(stat -c%s keystore/dsh-release.keystore) bytes"

      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: .

      - name: 注入 runtime.zip 到 assets
        run: mv runtime.zip app/src/main/assets/runtime.zip

      - name: 回填 MANIFEST 版本与校验值
        run: |
          SHA=$(sha256sum app/src/main/assets/runtime.zip | cut -d' ' -f1)
          # pull_request 时 GITHUB_REF_NAME 为 "1/merge"，含斜杠会污染版本串与文件名
          REF="${GITHUB_REF_NAME//\//-}"
          VER="${REF:-dev}-$(date +%Y%m%d)"
          jq --arg sha "$SHA" --arg ver "$VER" \
            '.version=$ver | .sha256=$sha' \
            app/src/main/assets/runtime/MANIFEST.json > /tmp/m.json
          mv /tmp/m.json app/src/main/assets/runtime/MANIFEST.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库不含 gradle-wrapper.jar（二进制不入库），用 setup-gradle 直接提供 gradle 命令
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: tag 构建必须有 release 签名
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_STORE_PASSWORD == ''
        run: |
          echo "::error::tag 构建缺少 RELEASE_* secrets，无法生成正式签名包。请在仓库 Settings → Secrets and variables → Actions 配置（见 docs/RELEASE.md）。"
          exit 1

      - name: 构建 APK（${{ matrix.abi }}）
        env:
          DSH_RELEASE_STORE_FILE: ${{ github.workspace }}/keystore/dsh-release.keystore
          DSH_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          DSH_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DSH_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail   # 否则管道 exit code 取 tee 的 0，Gradle 失败会被吞
          gradle -p . assembleDebug -Pabi=${{ matrix.abi }} --stacktrace 2>&1 | tee build-${{ matrix.abi }}.log
          if [ -n "${DSH_RELEASE_STORE_PASSWORD:-}" ] && [ -f keystore/dsh-release.keystore ]; then
            gradle -p . assembleRelease -Pabi=${{ matrix.abi }} --stacktrace 2>&1 | tee build-release-${{ matrix.abi }}.log
          else
            echo "::notice::no release signing material (RELEASE_* secrets); skipping assembleRelease"
          fi

      - name: Gradle-Log hochladen（Fehlerfall）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ matrix.abi }}
          path: build*.log
          retention-days: 7

      # 防呆自检：真机 16KB 页内核上 p_align=4096 的 so 会 dlopen 失败
      # （v0.1.0-m1 真机「卡在启动中」事故根因）。所有 LOAD 段必须 >=16384。
      - name: 校验 so 16KB 页对齐（${{ matrix.abi }}）
        run: |
          mkdir -p chk && cd chk
          unzip -o ../app/build/outputs/apk/debug/app-debug.apk 'lib/*.so' >/dev/null
          FAIL=0
          # 注意：readelf -lW 的 Align 列是 16 进制（如 0x4000），必须显式转十进制
          for so in $(find lib -name '*.so'); do
            BAD=$(readelf -lW "$so" \
              | awk '/LOAD/{v=$NF; if (v ~ /^0[xX]/){("printf %d " v) | getline n; close("printf %d " v)} else n=v+0; if (n+0 < 16384) print FILENAME": align="v}' \
              | head -3)
            if [ -n "$BAD" ]; then
              echo "::error file=$so::LOAD 段对齐 <16384：$BAD"
              FAIL=1
            else
              echo "OK $so"
            fi
          done
          exit $FAIL

      # [v1.2.97] 校验 APK 内 runtime.zip 的 bin/node 架构与目标 ABI 一致。
      # 光看 lib/<abi>/*.so 查不出来（那只是壳）—— 事故实况：外壳 arm64、
      # 内部 node 是 x86_64，真机直接 not executable: 64-bit ELF file，引擎无限重启。
      - name: 校验运行时架构（${{ matrix.abi }}）
        run: |
          python3 scripts/verify-runtime-abi.py \
            app/build/outputs/apk/debug/app-debug.apk ${{ matrix.abi }}

      # Gradle 对所有 ABI 都输出同名 app-debug.apk；
      # 必须在产物级先重命名，否则 release merge 时后传者覆盖先传者。
      # 文件名带当前 versionName：main/edge 为 dsh-android-<ref>-<abi>-v<ver>-<variant>.apk；
      # tag 构建的 ref 本身是 v<ver>，不再重复版本段。
      - name: 按版本+架构重命名 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          REF="${GITHUB_REF_NAME//\//-}"
          if [ "$REF" = "v$V" ]; then
            BASE="dsh-android-${REF}-${{ matrix.abi }}"
          else
            BASE="dsh-android-${REF}-${{ matrix.abi }}-v${V}"
          fi
          echo "APK_BASE=${BASE}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${BASE}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/${BASE}-release.apk"
          fi

      - name: 校验 release 签名（${{ matrix.abi }}）
        if: env.RELEASE_STORE_PASSWORD != ''
        run: |
          set -euo pipefail
          APK="dist/${APK_BASE}-release.apk"
          test -f "$APK" || { echo "::error::missing signed release apk: $APK"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "release-certs-${{ matrix.abi }}.txt"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]:' | tr 'A-Z' 'a-z')
          EXPECTED=$(printf '%s' "${{ vars.RELEASE_CERT_SHA256 }}" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::release certificate mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          echo "release certificate SHA-256: $ACTUAL"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug-apk-${{ matrix.abi }}
          path: dist/*-debug.apk
          retention-days: 1   # 仅 job 间传递用，避免 90 天默认堆积百 MB×N（曾堆 32GB）

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_STORE_PASSWORD != ''
        with:
          name: dsh-android-release-apk-${{ matrix.abi }}
          path: dist/*-release.apk
          retention-days: 1

  # ⚠️ v1.2.106：**取消 CI 自动发 release**。
  #
  # 原因：CI 构建出来的 APK 是 **debug 签名**，而对外发布的包必须是 **release 签名**
  # （keystore/dsh-release.keystore，证书 SHA-256 d28ca4f5…）—— 否则老用户无法覆盖
  # 升级；而且历史上确实出现过「用户下到了 debug 版」的混淆（主人反馈）。
  #
  # 发布流程改为人工两步（CI 只负责构建与产物校验，不发 release）：
  #   1) 本地：gradle assembleDebug -Pabi=arm64-v8a
  #   2) apksigner sign --ks keystore/dsh-release.keystore ... 然后 gh release create 上传
  #
  # —— 但本 Fork（jahdaganj02ki-sketch）的策略不同：这里 fork 自身就是分发渠道，
  #    debug 签名的自动构建产物直接进 Releases（见下方 release job）。上游仓库
  #    仍按上述人工两步走。

  # ---- 自动发布（v1.2.120）：main 构建成功后，双架构 APK 落到 Releases ----
  # 触发条件：push / dispatch / 定时，且 build-apk 成功；PR 不发（Fork 的
  # GITHUB_TOKEN 在 PR 上下文无写权限）。
  # ⚠️ 仅限 Fork 仓库：上游仓库的人工发布流程（release 签名 + 人工两步）不可被
  #    自动流程替代 —— CI 产物是 debug 签名，发到上游会让用户下到无法覆盖升级的包。
  #    故这里用 github.repository 硬门禁，合入上游后此 job 直接跳过。
  # 版本：app/build.gradle.kts 的 versionName + 本次 run_number，保证每个成功
  # 的构建版本号唯一（tag = v<versionName>-<run_number>），互不覆盖。
  release:
    if: >-
      github.repository == 'jahdaganj02ki-sketch/Deepseek-Harness-Local-Android'
      && github.event_name != 'pull_request'
      && needs.build-apk.result == 'success'
    needs: [build-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          C=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$C" >> "$GITHUB_OUTPUT"
          echo "tag=v$V-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 下载双架构 APK 工件
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-android-debug-apk-*
          merge-multiple: true
          path: apk/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: v${{ steps.ver.outputs.version }} · build ${{ github.run_number }}
          files: apk/*.apk
          generate_release_notes: true
          body: |
            自动构建：v${{ steps.ver.outputs.version }} (versionCode ${{ steps.ver.outputs.versionCode }}) · build ${{ github.run_number }}

            架构：arm64-v8a（真机）+ x86_64（模拟器）
            签名：debug（此 Fork 的自动分发渠道）

            - 已通过：运行时闭包校验（含内置 SSH 插件）、so 16KB 页对齐、APK ABI 校验、i18n 一致性
            - 安装注意：与 release 签名包签名不同，不能互相覆盖安装

  # ---------------------------------------------------------------------------
  # 正式发布（v1.4.18）：tag v* 触发，发布 debug + release 两个变体。
  # 前置：仓库 Secrets 已配置 RELEASE_*（见 docs/RELEASE.md）；build-apk 里 tag
  # 构建会强制要求签名材料，缺失即失败，不会产出「看起来能发」的 unsigned 包。
  # ---------------------------------------------------------------------------
  publish-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'XiaoPb/Deepseek-Harness-Local-Android'
      && needs.build-apk.result == 'success'
    needs: [build-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 校验 tag 与 versionName 一致
        run: |
          set -euo pipefail
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$V" || {
            echo "::error::tag $GITHUB_REF_NAME does not match v$V — bump versionName/versionCode first"
            exit 1
          }

      - name: 下载双架构产物
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-android-*-apk-*
          merge-multiple: true
          path: apk/

      - name: 确认双架构 × 双变体齐全
        run: |
          set -euo pipefail
          ls -lh apk/
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          REF="${GITHUB_REF_NAME//\//-}"
          for abi in arm64-v8a x86_64; do
            if [ "$REF" = "v$V" ]; then BASE="dsh-android-${REF}-${abi}"; else BASE="dsh-android-${REF}-${abi}-v${V}"; fi
            test -f "apk/${BASE}-release.apk"
            test -f "apk/${BASE}-debug.apk"
          done

      - name: 生成发布说明
        env:
          APK_DIR: apk
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          HARDSSH_REF: ${{ env.HARDSSH_REF }}
        run: bash scripts/generate-release-notes.sh tag release-notes.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH Mobile ${{ github.ref_name }}
          files: apk/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body_path: release-notes.md

      - name: 清理旧文件名的资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          API_BASE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/tags/${TAG_NAME}" | jq -r '.id')
          ASSETS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r '.[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -z "$asset_id" ] && continue
            if [ ! -f "apk/$asset_name" ]; then
              echo "remove stale asset: $asset_name (id=$asset_id)"
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${API_BASE_URL}/releases/assets/${asset_id}" >/dev/null
            fi
          done <<< "$ASSETS"

  # ---------------------------------------------------------------------------
  # Edge（每次 push main）：把最新 debug + release 发到 pre-release "edge"，
  # 用户不必等正式 tag 就能拿到包；tag v* 仍走上面的正式发布。
  # 只发布 main（避免 feature 分支覆盖 edge）；缺签名 secrets 时 release 构建
  # 会被跳过，本 job 直接失败并提示配置，避免发布「只有 debug」的半套。
  # ---------------------------------------------------------------------------
  publish-edge:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && github.repository == 'XiaoPb/Deepseek-Harness-Local-Android'
      && needs.build-apk.result == 'success'
    needs: [build-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-android-*-apk-*
          merge-multiple: true
          path: apk/

      - name: 确认双架构 × 双变体齐全
        run: |
          set -euo pipefail
          ls -lh apk/
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          REF="${GITHUB_REF_NAME//\//-}"
          for abi in arm64-v8a x86_64; do
            if [ "$REF" = "v$V" ]; then BASE="dsh-android-${REF}-${abi}"; else BASE="dsh-android-${REF}-${abi}-v${V}"; fi
            test -f "apk/${BASE}-debug.apk"
            test -f "apk/${BASE}-release.apk" || {
              echo "::error::missing signed release apk for $abi — configure RELEASE_* secrets (docs/RELEASE.md)"; exit 1; }
          done

      - name: 生成发布说明
        env:
          APK_DIR: apk
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          HARDSSH_REF: ${{ env.HARDSSH_REF }}
        run: bash scripts/generate-release-notes.sh edge edge-notes.md

      - name: 发布 edge 预发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: Edge · ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: apk/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: edge-notes.md

      - name: 清理旧文件名的资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: edge
        run: |
          set -euo pipefail
          API_BASE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/tags/${TAG_NAME}" | jq -r '.id')
          ASSETS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r '.[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -z "$asset_id" ] && continue
            if [ ! -f "apk/$asset_name" ]; then
              echo "remove stale asset: $asset_name (id=$asset_id)"
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${API_BASE_URL}/releases/assets/${asset_id}" >/dev/null
            fi
          done <<< "$ASSETS"

  # ---------------------------------------------------------------------------
  # v1.2.120：构建监视 —— 汇总两只 legs 的结果到 Step Summary，任一腿失败即整红。
  # 这样「构建挂了」不必逐 job 点开找：run 页面顶部就是一张表。
  # ---------------------------------------------------------------------------
  build-monitor:
    name: Build monitor (Zusammenfassung)
    needs: [build-hardssh-plugin, collect-runtime, build-apk, publish-edge, publish-release]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Ergebnis-Tabelle
        run: |
          {
            echo "## Build-Monitor — ${{ github.workflow }} @ ${{ github.ref_name }} (${{ github.event_name }})"
            echo "| Leg | Ergebnis |"
            echo "|---|---|"
            echo "| build-hardssh-plugin (GitHub ${{ env.HARDSSH_REF }}) | ${{ needs.build-hardssh-plugin.result }} |"
            echo "| collect-runtime (aarch64 + x86_64) | ${{ needs.collect-runtime.result }} |"
            echo "| build-apk (arm64-v8a + x86_64) | ${{ needs.build-apk.result }} |"
            echo "| publish-release (tag v*) | ${{ needs.publish-release.result }} |"
            echo "| publish-edge (push main) | ${{ needs.publish-edge.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fehlschlag durchstellen
        if: needs.build-hardssh-plugin.result != 'success' || needs.collect-runtime.result != 'success' || needs.build-apk.result != 'success' || needs.publish-release.result == 'failure' || needs.publish-edge.result == 'failure'
        run: |
          echo "::error::Build leg failed (hardssh=${{ needs.build-hardssh-plugin.result }}, collect-runtime=${{ needs.collect-runtime.result }}, build-apk=${{ needs.build-apk.result }}, publish-release=${{ needs.publish-release.result }}, publish-edge=${{ needs.publish-edge.result }})"
          exit 1
