name: android-build

# dsh-android 构建流水线
# v1.2.120 · 2026-10-13 — 全量触发 + 结果监视
#
# 双架构矩阵（arm64-v8a 真机 / x86_64 模拟器）：
#   build-hardssh —— 解析 npm 最新版本，从上游 Release 取 tgz，组装 APK 内置目录
#   fetch-runtime —— 取预构建运行时（滚动 prerelease runtime → releases/latest →
#                    本地兜底），不再每次现场编译；重建由 runtime-build 工作流负责
#   build-apk     —— 注入 runtime.zip 进 assets → gradle -Pabi=... 出 APK
#   publish-preview —— 每日定时：双架构 debug 包发到滚动 pre-release "preview"
#   build-monitor —— 汇总各 legs 结果到 Step Summary，任一失败即整红
#
# 运行时来源（v1.4.27，详见 docs/CI_RUNTIME_PIPELINE.md）：
#   runtime.zip 由 .github/workflows/runtime-build.yml 构建并发布到 prerelease
#   tag "runtime"；本流水线只负责取用 + 统一闭包校验，"不重编译" 不等于 "不带
#   完整运行时" —— full APK 照旧内嵌 runtime.zip，正式 Release 照旧附 2 个 zip。
#
# 监视：每次 push / PR / dispatch / 定时都跑，build-monitor 汇总各 legs 的结果
# 写入 Step Summary，失败即整红；Gradle 日志按需留存 7 天。
# ⚠️ Fork 本仓库后 GitHub 会把本 workflow 置为 disabled_fork：
#    需在 Actions → android-build 页面点一次 “Enable workflow” 才会运行。
# 触发一览：push(任意分支/tag v*) · pull_request(任意目标分支) · 每日 01:30 Asia/Shanghai · 手动 dispatch
# tag 只认严格 v<major>.<minor>.<patch>（禁止 v*.*.*-*）；预览版走每日定时的 preview。

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    # GitHub Actions 的 cron 固定按 UTC 解析，没有时区字段：
    # 17:30 UTC = 次日 01:30 Asia/Shanghai（UTC+8）——要改北京时间，改这里的 UTC 值。
    - cron: "30 17 * * *"   # 每日 01:30 Asia/Shanghai（= UTC 17:30）
  workflow_dispatch:

env:
  # 时区统一为 Asia/Shanghai（GitHub 的 schedule 只能写 UTC，换算见上面 cron 注释；
  # 这里只影响步骤内 date 等本地时间，发布说明脚本用的是 date -u，不受影响）。
  TZ: Asia/Shanghai
  # 内置 SSH 远程工作区插件（@xiaopb/dsh-hardssh）：不再从源码构建，
  # 也不再塞进 runtime.zip。构建时解析 npm 最新版本，从上游 Release 取 tgz
  # （与 npm 包同 integrity），组装成 APK 的 assets/hardssh/ 内置副本。
  # 升级插件 = 让上游发版；需要钉死时在仓库 Variables 设置 HARDSSH_VERSION。
  HARDSSH_VERSION: latest

permissions:
  contents: read   # release 段仍注释；启用时在该 job 内单独提权

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main 上新 push 取代旧构建，避免并发的 edge 发布互相覆盖（最新提交最终生效）；
  # tag 构建不互相取消，避免半个正式发布。
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # 内置 SSH 远程工作区插件（@xiaopb/dsh-hardssh）
  #
  # 设计约束（v1.4.20）：插件源码/发布包都不进入本仓库；CI 解析 npm 最新版本，
  # 从上游 Release 取 tgz 并校验 npm integrity，组装成 APK 内置目录。
  # 纯 JS 包（ssh2/ws），与 ABI 无关，只构建一次，两个架构复用。
  # ---------------------------------------------------------------------------
  build-hardssh:
    runs-on: ubuntu-24.04
    steps:
      - name: 校验 tag 格式（正式版只允许严格 v<major>.<minor>.<patch>）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::非法 tag '$GITHUB_REF_NAME'：正式版只允许严格的 v<major>.<minor>.<patch>，禁止 v*.*.*-*；预览版由每日定时发布到 preview。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 组装内置 SSH 插件（上游 Release tgz）
        env:
          HARDSSH_VERSION: ${{ vars.HARDSSH_VERSION }}
        run: |
          chmod +x scripts/pack-hardssh.sh
          ./scripts/pack-hardssh.sh dist
          python3 scripts/verify-hardssh-bundle.py dist/hardssh

      - uses: actions/upload-artifact@v4
        with:
          name: hardssh-bundle
          path: |
            dist/hardssh
            dist/hardssh.json
          retention-days: 1

  # ---------------------------------------------------------------------------
  # v1.4.27：运行时不再每次 CI 现场编译。
  #
  # 此前每次 push/PR/定时都要在 runner 上 apt 收集 Termux 闭包 + 打补丁 + 打包
  # 127MB×2（5-10 分钟），且 Termux 仓库浮动导致同一 commit 两次构建 sha 可能不同。
  # 现在统一由 runtime-build 工作流按需构建、发布到滚动 prerelease tag "runtime"，
  # 本 job 只负责按优先级取用：
  #   ① prerelease tag "runtime"（带 runtime-meta，sha256 校验）
  #   ② releases/latest 正式发布自带的 runtime-<abi>.zip（meta 从 zip 内 BUILD.json 重建）
  #   ③ 本地兜底构建（前两级全缺失时，如新 fork bootstrap）
  # 三级产物统一过下面的「运行时命令闭包」校验，安全网保持不变。
  # ---------------------------------------------------------------------------
  fetch-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
          - termux_arch: x86_64
            abi: x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装兜底构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt dpkg-dev zip unzip

      - name: 计算本地 runtime 脚本指纹
        id: fp
        run: echo "sha=$(python3 scripts/runtime-inputs-sha.py .)" >> "$GITHUB_OUTPUT"

      - name: 获取运行时（${{ matrix.abi }}）
        env:
          GH_TOKEN: ${{ github.token }}
          FP: ${{ steps.fp.outputs.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          chmod +x scripts/fetch-runtime.sh scripts/build-runtime.sh scripts/collect-termux-runtime.sh
          # 把加载到手的包与「当前仓库的运行时脚本」对一下指纹：不一致说明 prerelease
          # 还是旧补丁产物，此时应当先重建运行时，而不是拿旧包去撞打包门禁。
          ARGS=(--abi "${{ matrix.abi }}" --out runtime.zip --meta runtime-meta.json
                --expect-sha "$FP")
          # tag 构建＝正式发布：必须内嵌按本 tag 脚本构建的运行时，禁止降级。
          # 否则同一个 tag 在不同时间构建会得到不同的 runtime，发布不可复现。
          if [ "$REF_TYPE" = "tag" ]; then
            ARGS+=(--strict)
          fi
          ./scripts/fetch-runtime.sh "${ARGS[@]}"
          echo "--- runtime-meta ---"
          cat runtime-meta.json

      - name: 校验运行时命令闭包（${{ matrix.abi }}）
        run: |
          rm -rf runtime-check && mkdir runtime-check
          unzip -q runtime.zip -d runtime-check
          test -x runtime-check/bin/bash
          test -x runtime-check/bin/rg
          # SONAME 精确文件名（Android linker 按 NEEDED 逐字查找）
          for so in libreadline.so.8 libhistory.so.8 libncursesw.so.6 libncurses.so.6 \
                    libiconv.so libpcre2-8.so; do
            test -e "runtime-check/lib/$so" || { echo "::error::SONAME 库 lib/$so 缺失"; exit 1; }
          done
          # 工具 wrapper（m1.6.8 真机验证版）
          test -x runtime-check/bin/pnpm
          test -x runtime-check/bin/curl
          test -e runtime-check/usr/bin/.keep
          # ripgrep 平台包（android resolver 的 require.resolve 目标）
          case "${{ matrix.termux_arch }}" in
            aarch64) NA=arm64 ;; x86_64) NA=x64 ;;
          esac
          test -x "runtime-check/lib/node_modules/@vscode/ripgrep-android-$NA/bin/rg" \
            || { echo "::error::ripgrep 平台包缺失"; exit 1; }
          if find runtime-check -type f -path '*@vscode/ripgrep-linux-*/*/rg' -print -quit | grep -q .; then
            echo "::error::runtime 混入宿主 Linux ripgrep"
            exit 1
          fi
          # v1.4.20：hardssh 已与 runtime 解耦，runtime.zip 内出现它说明注入逻辑
          # 又回来了（会导致云端运行时重装丢插件），必须挡住。
          if [ -e "runtime-check/lib/node_modules/@xiaopb/dsh-hardssh" ]; then
            echo "::error::runtime.zip 不应包含 @xiaopb/dsh-hardssh（已解耦到 APK 内置目录）"
            exit 1
          fi
          echo "bash/rg/SONAME/wrapper runtime closure OK（hardssh 已解耦）"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: |
            runtime.zip
            runtime-meta.json
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-meta-${{ matrix.abi }}
          path: runtime-meta.json
          retention-days: 1

  build-apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
            package: full
          - termux_arch: x86_64
            abi: x86_64
            package: full
          - termux_arch: aarch64
            abi: arm64-v8a
            package: noruntime
          - termux_arch: x86_64
            abi: x86_64
            package: noruntime
    runs-on: ubuntu-24.04
    needs: [fetch-runtime, build-hardssh]
    # 正式签名材料（v1.4.18）：GitHub Secrets 注入为环境变量，供下方解码/构建步骤使用。
    # 未配置时为空字符串 → 只构建 debug；tag 构建会被「tag 构建必须有 release 签名」拦下。
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      # 共享 debug 签名密钥（v1.4.37）：与 release 同一套规矩 —— 只从 secrets 注入，
      # 仓库里**没有**私钥（见 docs/RELEASE.md §3）。未配置时 Gradle 退回 runner 本机
      # 默认 key：构建照常成功，但那批 debug 包无法与历史包互相覆盖（fork PR 即如此）。
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
      DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      # v1.4.25：磁盘/内存护栏。full 形态要连续构建 debug+release，每次都要
      # 吞吐 127MB 的 runtime.zip（解压后 ~500MB），加上 8 个矩阵 lane 并行，
      # 曾出现单个 lane（x86_64 full）偶发失败而同代码 tag 构建正常的情况——
      # 典型的 runner 资源抖动。这里先清掉用不到的预装组件再报告剩余空间，
      # 失败时日志里能直接看到瓶颈。
      - name: 释放磁盘并报告可用空间
        env:
          # 与 app/build.gradle.kts 的 ndkVersion 保持一致；镜像里预装的同版本保留复用，
          # 其余版本删掉腾空间（整目录删掉会逼 Gradle 现场下载，反而成为新的抖动源）。
          NDK_VERSION: "26.1.10909125"
        run: |
          echo "--- before ---"
          df -h / | tail -1
          NDK_ROOT=/usr/local/lib/android/sdk/ndk
          if [ -d "$NDK_ROOT/$NDK_VERSION" ]; then
            sudo find "$NDK_ROOT" -mindepth 1 -maxdepth 1 ! -name "$NDK_VERSION" -exec rm -rf {} + || true
            echo "kept preinstalled ndk $NDK_VERSION"
          else
            sudo rm -rf "$NDK_ROOT" || true
          fi
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "--- after ---"
          df -h / | tail -1
          free -m | head -2

      - name: 解码 release keystore（配置了签名 secret 时）
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/dsh-release.keystore
          chmod 600 keystore/dsh-release.keystore
          echo "release keystore ready: $(stat -c%s keystore/dsh-release.keystore) bytes"

      # debug 共享密钥：解到 $RUNNER_TEMP，不进工作树 —— 避免任何 "被 artifact 打包/被 git add"
      # 的机会（工作树里的 debug-signing/ 只是个便利的本地回退位置）。
      - name: 解码 debug keystore（配置了共享 debug 签名 secret 时）
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/dsh-debug/dsh-debug.keystore"
          mkdir -p "$(dirname "$DEST")"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$DEST"
          chmod 600 "$DEST"
          {
            echo "DSH_DEBUG_STORE_FILE=$DEST"
            echo "DSH_DEBUG_STORE_PASSWORD=${DEBUG_STORE_PASSWORD:-dsh-debug}"
            echo "DSH_DEBUG_KEY_ALIAS=${DEBUG_KEY_ALIAS:-dsh-debug}"
          } >> "$GITHUB_ENV"
          echo "debug keystore ready: $(stat -c%s "$DEST") bytes"

      - uses: actions/download-artifact@v4
        with:
          name: hardssh-bundle
          path: hardssh-dist

      - uses: actions/download-artifact@v4
        with:
          name: runtime-meta-${{ matrix.abi }}
          path: runtime-meta

      - uses: actions/download-artifact@v4
        if: matrix.package == 'full'
        with:
          name: runtime-${{ matrix.abi }}
          path: runtime-dist

      - name: 检查构建资产（${{ matrix.package }}）
        run: |
          test -f hardssh-dist/hardssh/lib/index.js
          test -f hardssh-dist/hardssh/node_modules/ssh2/package.json
          test -f runtime-meta/runtime-meta.json
          if [ "${{ matrix.package }}" = "full" ]; then
            test -f runtime-dist/runtime.zip
            echo "full: runtime.zip $(stat -c%s runtime-dist/runtime.zip) bytes"
          else
            if [ -f app/src/main/assets/runtime.zip ]; then
              echo "::error::noruntime build found stale app/src/main/assets/runtime.zip"
              exit 1
            fi
            echo "noruntime: no runtime.zip (downloaded on first launch)"
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库不含 gradle-wrapper.jar（二进制不入库），用 setup-gradle 直接提供 gradle 命令
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 预装 native 构建组件（CMake + NDK，带重试 + 残留清理）
      #
      # 背景：configureCMakeDebug 阶段由 Gradle 触发的 sdkmanager 现场自动安装，遇网络
      # 抖动会下出损坏的包，直接把整条 leg 打挂——CMake 3.22.1 在 v1.4.25 踩过一次
      # （"Error on ZipFile unknown archive"），NDK 26.1.10909125 在 v1.4.37 的 tag
      # 构建里又复现（"Archive is not a ZIP archive"，同批 x86_64 lane 同代码全绿，
      # 典型 runner 网络抖动）。这里提前装好并校验落地结果，Gradle 就不再构建中现场拉取。
      - name: 预装 native 组件（CMake 3.22.1 + NDK 26.1.10909125，带重试）
        env:
          NDK_VERSION: "26.1.10909125"
          CMAKE_VERSION: "3.22.1"
        run: |
          set -uo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          # 就绪判定看**落地文件**而不是退出码：sdkmanager 有时"装完"但内容缺件。
          ready() {
            case "$1" in
              "cmake;$CMAKE_VERSION")
                [ -f "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" ] ;;
              "ndk;$NDK_VERSION")
                [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ] &&
                [ -d "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" ] ;;
              *) return 1 ;;
            esac
          }
          # 重试前清残留：中断会留下半截目录 / 临时包，不清的话下一次直接沿用坏包。
          purge() {
            case "$1" in
              "cmake;$CMAKE_VERSION") sudo rm -rf "$ANDROID_HOME/cmake/$CMAKE_VERSION" ;;
              "ndk;$NDK_VERSION")     sudo rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" ;;
            esac
            sudo rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates" || true
          }

          for PKG in "cmake;$CMAKE_VERSION" "ndk;$NDK_VERSION"; do
            LOG="/tmp/sdkmanager-$(echo "$PKG" | tr ';' '-').log"
            if ready "$PKG"; then
              echo "$PKG already present"
              continue
            fi
            OK=0
            for i in 1 2 3 4; do
              purge "$PKG"
              if "$SDKM" --install "$PKG" > "$LOG" 2>&1 && ready "$PKG"; then
                echo "$PKG installed (attempt $i)"
                OK=1
                break
              fi
              echo "::warning::install $PKG attempt $i failed, retrying in 20s..."
              tail -n 30 "$LOG" || true
              sleep 20
            done
            if [ "$OK" != "1" ]; then
              echo "::error::failed to install $PKG after 4 attempts"
              tail -n 60 "$LOG" || true
              exit 1
            fi
          done
          du -sh "$ANDROID_HOME/cmake/$CMAKE_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION" || true

      - name: tag 构建必须有 release 签名
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_STORE_PASSWORD == ''
        run: |
          echo "::error::tag 构建缺少 RELEASE_* secrets，无法生成正式签名包。请在仓库 Settings → Secrets and variables → Actions 配置（见 docs/RELEASE.md）。"
          exit 1

      - name: 构建 APK（${{ matrix.abi }} / ${{ matrix.package }}）
        env:
          DSH_RELEASE_STORE_FILE: ${{ github.workspace }}/keystore/dsh-release.keystore
          DSH_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          DSH_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DSH_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail   # 否则管道 exit code 取 tee 的 0，Gradle 失败会被吞
          META=runtime-meta/runtime-meta.json
          RVER=$(jq -r '.version' "$META")
          RSHA=$(jq -r '.sha256' "$META")
          RSIZE=$(jq -r '.size' "$META")
          RUNPACKED=$(jq -r '.unpackedBytes' "$META")
          RBUILT=$(jq -r '.builtAt // 0' "$META")
          ARGS=(
            -Pabi=${{ matrix.abi }}
            -Ppackage=${{ matrix.package }}
            -PhardsshDir="${{ github.workspace }}/hardssh-dist/hardssh"
            -PruntimeVersion="$RVER"
            -PruntimeBuiltAt="$RBUILT"
            -PruntimeSha256="$RSHA"
            -PruntimeSize="$RSIZE"
            -PruntimeUnpacked="$RUNPACKED"
          )
          if [ "${{ matrix.package }}" = "full" ]; then
            ARGS+=(-PruntimeZip="${{ github.workspace }}/runtime-dist/runtime.zip")
          fi
          gradle -p . assembleDebug "${ARGS[@]}" --stacktrace 2>&1 | tee build-${{ matrix.abi }}-${{ matrix.package }}.log
          if [ -n "${DSH_RELEASE_STORE_PASSWORD:-}" ] && [ -f keystore/dsh-release.keystore ]; then
            # -PrequireReleaseSigning=true：正式包缺私钥时必须失败，不能产出
            # app-release-unsigned.apk 让发布链路误当正式包上传。
            gradle -p . assembleRelease "${ARGS[@]}" -PrequireReleaseSigning=true \
              --stacktrace 2>&1 | tee build-release-${{ matrix.abi }}-${{ matrix.package }}.log
          else
            echo "::notice::no release signing material (RELEASE_* secrets); skipping assembleRelease"
          fi

      - name: Gradle-Log hochladen（Fehlerfall）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ matrix.abi }}
          path: build*.log
          retention-days: 7

      # 防呆自检：真机 16KB 页内核上 p_align=4096 的 so 会 dlopen 失败
      # （v0.1.0-m1 真机「卡在启动中」事故根因）。所有 LOAD 段必须 >=16384。
      - name: 校验 so 16KB 页对齐（${{ matrix.abi }}）
        run: |
          mkdir -p chk && cd chk
          unzip -o ../app/build/outputs/apk/debug/app-debug.apk 'lib/*.so' >/dev/null
          FAIL=0
          # 注意：readelf -lW 的 Align 列是 16 进制（如 0x4000），必须显式转十进制
          for so in $(find lib -name '*.so'); do
            BAD=$(readelf -lW "$so" \
              | awk '/LOAD/{v=$NF; if (v ~ /^0[xX]/){("printf %d " v) | getline n; close("printf %d " v)} else n=v+0; if (n+0 < 16384) print FILENAME": align="v}' \
              | head -3)
            if [ -n "$BAD" ]; then
              echo "::error file=$so::LOAD 段对齐 <16384：$BAD"
              FAIL=1
            else
              echo "OK $so"
            fi
          done
          exit $FAIL

      # [v1.2.97] 校验 APK 内 runtime.zip 的 bin/node 架构与目标 ABI 一致。
      # 光看 lib/<abi>/*.so 查不出来（那只是壳）—— 事故实况：外壳 arm64、
      # 内部 node 是 x86_64，真机直接 not executable: 64-bit ELF file，引擎无限重启。
      - name: 校验运行时架构（${{ matrix.package }} / ${{ matrix.abi }}）
        if: matrix.package == 'full'
        run: |
          python3 scripts/verify-runtime-abi.py \
            app/build/outputs/apk/debug/app-debug.apk ${{ matrix.abi }}

      # Gradle 对所有 ABI 都输出同名 app-debug.apk；
      # 必须在产物级先重命名，否则 release merge 时后传者覆盖先传者。
      # 文件名带当前 versionName：main/edge 为 dsh-android-<ref>-<abi>-v<ver>-<variant>.apk；
      # tag 构建的 ref 本身是 v<ver>，不再重复版本段。
      - name: 按版本+架构+形态重命名 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          REF="${GITHUB_REF_NAME//\//-}"
          if [ "$REF" = "v$V" ]; then
            BASE="dsh-android-${REF}-${{ matrix.abi }}"
          else
            BASE="dsh-android-${REF}-${{ matrix.abi }}-v${V}"
          fi
          SUFFIX=""
          if [ "${{ matrix.package }}" = "noruntime" ]; then SUFFIX="-noruntime"; fi
          APK_BASE="${BASE}${SUFFIX}"
          echo "APK_BASE=${APK_BASE}" >> "$GITHUB_ENV"
          echo "APK_RELEASE=dist/${BASE}-release${SUFFIX}.apk" >> "$GITHUB_ENV"
          echo "APK_DEBUG=dist/${BASE}-debug${SUFFIX}.apk" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${BASE}-debug${SUFFIX}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/${BASE}-release${SUFFIX}.apk"
          fi
          # 运行时事实随工件带走：publish-* 作业只下载 APK 工件，拿不到
          # assets/runtime/MANIFEST.json（构建期生成、不入库），没有它就无法判断
          # 「本次更新有没有换运行时」（自动更新的 noruntime 二选一依赖这个）。
          #
          # ⚠️ v1.4.37 修：清单在 `app/build/generated/runtimeAssets/runtime/`，不在
          # `app/src/main/assets/runtime/`（那是迁移前的旧位置，见 build.gradle.kts
          # 的 runtimeAssetsDir）。旧路径永远 -f 不成立 → meta 里 builtAt 恒 0 →
          # 发布索引全靠 null 兜底，App 侧把 "null" 当成"运行时变了"。
          # ⚠️ v1.4.38：路径必须带 `app/` 前缀 —— `runtimeAssetsDir` 由 app 模块的
          # `layout.buildDirectory` 求值，仓库根的 `build/generated/...` 是另一个目录，
          # 写成根路径照样 `-f` 恒假（和上一处是同一类错的两种写法）。
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          MAN="app/build/generated/runtimeAssets/runtime/MANIFEST.json"
          # 索引字段（asset.runtimeVersion）的语义是「**这个 APK 自带**的运行时版本」：
          # noruntime 不带运行时 → 必须留空，否则 App 会以为装完包就有新运行时。
          RTV=""; RTB=0
          if [ "${{ matrix.package }}" = "full" ] && [ -f "$MAN" ]; then
            RTV=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));r=d.get('runtime') or {};print(r.get('version') or d.get('version') or '')" "$MAN")
            RTB=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));r=d.get('runtime') or {};print(int(r.get('builtAt') or 0))" "$MAN")
          fi
          # 诊断用：两种包的 MANIFEST 都该写全运行时身份（version/builtAt/sha），
          # noruntime 只是不携带 runtime.zip。日志里能一眼看出「没读到」还是「读到空」。
          if [ -f "$MAN" ]; then
            python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]));r=d.get('runtime') or {}
          print('manifest: package=%s abi=%s version=%s builtAt=%s sha=%s bundled=%s' % (
              d.get('package'), d.get('abi'), r.get('version'), r.get('builtAt'),
              (r.get('sha256') or '')[:12] or '-', r.get('bundled')))
          " "$MAN"
          fi
          echo "meta: versionCode=$VC package=${{ matrix.package }} runtimeVersion=${RTV:-<none>} builtAt=$RTB"
          python3 -c "
          import json,sys
          json.dump({'versionCode':int(sys.argv[1]),'versionName':sys.argv[2],'abi':sys.argv[3],
                     'package':sys.argv[4],'runtimeVersion':sys.argv[5] or None,
                     'runtimeBuiltAt':int(sys.argv[6])},
                    open(sys.argv[7],'w'), ensure_ascii=False, indent=2)
          " "$VC" "$V" "${{ matrix.abi }}" "${{ matrix.package }}" "$RTV" "$RTB" \
            "dist/meta-${{ matrix.abi }}-${{ matrix.package }}.json"
          ls -1 dist/

      - name: 校验 APK 资产形态（${{ matrix.package }} / ${{ matrix.abi }}）
        run: |
          set -euo pipefail
          python3 scripts/verify-apk-assets.py "$APK_DEBUG" \
            --expect-package ${{ matrix.package }} --expect-abi ${{ matrix.abi }}
          if [ -f "$APK_RELEASE" ]; then
            python3 scripts/verify-apk-assets.py "$APK_RELEASE" \
              --expect-package ${{ matrix.package }} --expect-abi ${{ matrix.abi }}
          fi

      # debug 签名必须固定：否则 edge/preview 的 debug 包签名每版都不同，
      # 无法覆盖安装，自动更新在 debug 渠道上等于不存在（docs/AUTO_UPDATE_PLAN.md §13）。
      #
      # 私钥与期望指纹都只在仓库变量里（仓库一个字节都不留），所以要区分三种情况：
      #   ① 没配 secret（fork PR）→ 本来就用 runner 随机 key，只能警告 + 跳过；
      #   ② 配了 secret 却没配 DEBUG_CERT_SHA256 变量 → 配置错误，直接失败（否则
      #      "校验通过"其实是没校验）；
      #   ③ 都配了 → 严格比对，防 signingConfig 静默失效产出不可覆盖的包。
      - name: 校验 debug 签名固定（覆盖升级前提）
        env:
          HAS_DEBUG_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
          EXPECTED_DEBUG_CERT: ${{ vars.DEBUG_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="$APK_DEBUG"
          test -f "$APK" || { echo "::error::missing debug apk: $APK"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]:' | tr 'A-Z' 'a-z')
          if [ -z "$ACTUAL" ]; then
            echo "::error::cannot read debug apk certificate"
            exit 1
          fi
          echo "debug certificate SHA-256: $ACTUAL"

          if [ "$HAS_DEBUG_SECRET" != "true" ]; then
            echo "::warning::未配置 DEBUG_KEYSTORE_BASE64，本次 debug 包用的是 runner 本机默认 key。"
            echo "::warning::该产物不可分发：与历史 edge/preview 包签名不同，无法覆盖安装（fork PR 属预期）。"
            exit 0
          fi

          EXPECTED_RAW="${EXPECTED_DEBUG_CERT:-}"
          if [ -z "$EXPECTED_RAW" ]; then
            echo "::error::配置了 DEBUG_KEYSTORE_BASE64 但没有 DEBUG_CERT_SHA256 变量，无法校验签名。"
            echo "—— 去 Settings → Secrets and variables → Actions → Variables 补上（见 docs/RELEASE.md §3）。"
            exit 1
          fi
          EXPECTED=$(printf '%s' "$EXPECTED_RAW" | tr -d '[:space:]:' | tr 'A-Z' 'a-z')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::debug apk 不是用共享 debug key 签的（actual=$ACTUAL expected=$EXPECTED）"
            echo "—— 这会让 debug 包无法覆盖升级。检查 secret 是否换过、以及 app/build.gradle.kts 的 signingConfigs.debug。"
            exit 1
          fi
          echo "debug 签名与共享 key 一致"

      - name: 校验 release 签名（${{ matrix.abi }}）
        if: env.RELEASE_STORE_PASSWORD != ''
        run: |
          set -euo pipefail
          APK="$APK_RELEASE"
          test -f "$APK" || { echo "::error::missing signed release apk: $APK"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "release-certs-${{ matrix.abi }}.txt"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]:' | tr 'A-Z' 'a-z')
          EXPECTED=$(printf '%s' "${{ vars.RELEASE_CERT_SHA256 }}" | tr -d ':' | tr 'A-Z' 'a-z')
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::release certificate mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          echo "release certificate SHA-256: $ACTUAL"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-apk-${{ matrix.abi }}-${{ matrix.package }}
          path: |
            dist/*.apk
            dist/meta-*.json
          retention-days: 1   # 仅 job 间传递用，避免 90 天默认堆积百 MB×N（曾堆 32GB）

  # ⚠️ v1.2.106：**取消 CI 自动发 release**。
  #
  # 原因：CI 构建出来的 APK 是 **debug 签名**，而对外发布的包必须是 **release 签名**
  # （keystore/dsh-release.keystore，证书 SHA-256 d28ca4f5…）—— 否则老用户无法覆盖
  # 升级；而且历史上确实出现过「用户下到了 debug 版」的混淆（主人反馈）。
  #
  # 发布流程改为人工两步（CI 只负责构建与产物校验，不发 release）：
  #   1) 本地：gradle assembleDebug -Pabi=arm64-v8a
  #   2) apksigner sign --ks keystore/dsh-release.keystore ... 然后 gh release create 上传
  #
  # —— 自动发布策略：默认仅上游 Soodok 仓库自动发布；Fork 需在仓库 Variables
  #    新建 ENABLE_CI_IN_FORK=true，debug 自动构建产物才会进本 Fork 的 Releases
  #    （见下方 publish-preview）。上游仓库仍按上述人工两步走。

  # ---- 预览版（每日定时）：双架构 debug 包发到滚动 prerelease "preview" ----
  # v1.4.20 发布语义（本仓库固定）：
  #   正式版 → 只接受严格 tag v<major>.<minor>.<patch>（publish-release；禁止 v*.*.*-*）；
  #   main push → publish-edge（滚动 edge，debug + release）；
  #   每日 01:30 schedule → 本 job（滚动 preview，debug 双架构，只保留最新一版）。
  # 历史根因：旧 release job 每次 push/定时都新建 v<ver>-<run_number> Release，而该 tag
  #   又命中 on.push.tags: v* 触发下一轮构建 —— 自激刷包（v1.4.18-380/381/382/384）。
  #   现在固定用 tag "preview"，工作流不再创建任何 v* tag。
  publish-preview:
    if: >-
      (github.repository == 'Soodok/Deepseek-Harness-Local-Android' ||
       vars.ENABLE_CI_IN_FORK == 'true')
      && github.event_name == 'schedule'
      && needs.build-apk.result == 'success'
    needs: [build-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          C=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$C" >> "$GITHUB_OUTPUT"

      - name: 下载双架构 × 双形态 APK 工件
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-android-apk-*
          merge-multiple: true
          path: apk/

      - name: 确认 8 个 APK 齐全（debug+release × full+noruntime × 2 ABI）
        run: |
          set -euo pipefail
          ls -lh apk/
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          REF="${GITHUB_REF_NAME//\//-}"
          for abi in arm64-v8a x86_64; do
            BASE="dsh-android-${REF}-${abi}-v${V}"
            test -f "apk/${BASE}-debug.apk"
            test -f "apk/${BASE}-release.apk"
            test -f "apk/${BASE}-debug-noruntime.apk"
            test -f "apk/${BASE}-release-noruntime.apk"
          done

      - name: 生成并签名 update-index.json（自动更新的哈希清单）
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          bash scripts/publish-update-index.sh --channel preview --tag preview \
            --apk-dir apk --out-dir release \
            --notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/preview"

      - name: 发布预览版（滚动 prerelease preview）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Preview · v${{ steps.ver.outputs.version }} · build ${{ github.run_number }}
          files: |
            apk/*.apk
            release/update-index.json
            release/update-index.json.sig
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            每日定时（01:30）预览构建：v${{ steps.ver.outputs.version }} (versionCode ${{ steps.ver.outputs.versionCode }}) · build ${{ github.run_number }}

            架构：arm64-v8a（真机）+ x86_64（模拟器）
            形态：full（含 runtime.zip，离线可用）+ noruntime（首启下载运行时）
            签名：release（可覆盖正式版）+ debug（仅测试）

            - 已通过：运行时闭包校验（hardssh 已与 runtime 解耦）、so 16KB 页对齐、APK ABI 校验
            - `*-noruntime.apk` 不含运行时；首次启动按 MANIFEST 链接下载（支持 gh-proxy）
            - 正式版只认严格 tag v<major>.<minor>.<patch> 触发的 Release

      - name: 清理旧文件名的资产（只保留最新一版）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: preview
        run: |
          set -euo pipefail
          API_BASE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/tags/${TAG_NAME}" | jq -r '.id')
          ASSETS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r '.[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -z "$asset_id" ] && continue
            if [ ! -f "apk/$asset_name" ] && [ ! -f "release/$asset_name" ]; then
              echo "remove stale asset: $asset_name (id=$asset_id)"
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${API_BASE_URL}/releases/assets/${asset_id}" >/dev/null
            fi
          done <<< "$ASSETS"
  # ---------------------------------------------------------------------------
  # 正式发布（v1.4.18）：tag v* 触发，发布 debug + release 两个变体。
  # 前置：仓库 Secrets 已配置 RELEASE_*（见 docs/RELEASE.md）；build-apk 里 tag
  # 构建会强制要求签名材料，缺失即失败，不会产出「看起来能发」的 unsigned 包。
  # ---------------------------------------------------------------------------
  publish-release:
    if: >-
      (github.repository == 'Soodok/Deepseek-Harness-Local-Android' ||
       vars.ENABLE_CI_IN_FORK == 'true')
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build-apk.result == 'success'
    needs: [build-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 校验 tag 与 versionName 一致
        run: |
          set -euo pipefail
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$V" || {
            echo "::error::tag $GITHUB_REF_NAME does not match v$V — bump versionName/versionCode first"
            exit 1
          }

      - name: 下载双架构产物
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-android-apk-*
          merge-multiple: true
          path: apk/

      - name: 确认 8 个 APK 齐全
        run: |
          set -euo pipefail
          ls -lh apk/
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          REF="${GITHUB_REF_NAME//\//-}"
          for abi in arm64-v8a x86_64; do
            if [ "$REF" = "v$V" ]; then BASE="dsh-android-${REF}-${abi}"; else BASE="dsh-android-${REF}-${abi}-v${V}"; fi
            test -f "apk/${BASE}-debug.apk"
            test -f "apk/${BASE}-release.apk"
            test -f "apk/${BASE}-debug-noruntime.apk"
            test -f "apk/${BASE}-release-noruntime.apk"
          done

      - name: 下载运行时资产
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: runtime-dist

      - name: 归档运行时 zip（tag 资产的下载链接）
        run: |
          set -euo pipefail
          mkdir -p release
          for abi in arm64-v8a x86_64; do
            src="runtime-dist/runtime-${abi}/runtime.zip"
            test -f "$src" || { echo "::error::missing runtime zip for $abi"; exit 1; }
            cp "$src" "release/runtime-${abi}.zip"
          done
          ls -lh release/

      - name: 生成并签名 runtime-index.json
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RUNTIME_INDEX_KEY_ID: ${{ vars.RUNTIME_INDEX_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || {
            echo "::error::缺少 RELEASE_KEYSTORE_BASE64（索引复用 APK 正式签名密钥）"; exit 1; }
          KS=/tmp/dsh-release.keystore
          KEY=/tmp/runtime-index-signing-key.pem
          PUB=/tmp/runtime-index-pub.pem
          CERT=/tmp/runtime-index-cert.pem
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          # 导出公钥供本步自验签（与 App 构建期生成的是同一把 key）。
          openssl pkcs12 -in "$KS" -nokeys -clcerts \
            -passin pass:"$RELEASE_STORE_PASSWORD" -out "$CERT" 2>/dev/null
          openssl x509 -in "$CERT" -pubkey -noout > "$PUB"
          # 从 PKCS12 中取出正式签名私钥（RSA-4096），只用于本次索引签名，结束即删。
          # 该 keystore 只有一个私钥 alias（dsh-release）；-name 在非 -export 模式下会被忽略。
          if ! openssl pkcs12 -in "$KS" -nocerts -nodes \
              -passin pass:"$RELEASE_STORE_PASSWORD" -out "$KEY" 2>/dev/null; then
            # 老 keystore 可能使用 legacy 算法（RC2/3DES）
            openssl pkcs12 -legacy -in "$KS" -nocerts -nodes \
              -passin pass:"$RELEASE_STORE_PASSWORD" -out "$KEY" 2>/dev/null
          fi
          chmod 600 "$KEY"
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          KEY_ID="${RUNTIME_INDEX_KEY_ID:-release-keystore}"
          python3 scripts/write-runtime-index.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --meta runtime-dist/runtime-meta-arm64-v8a/runtime-meta.json \
            --meta runtime-dist/runtime-meta-x86_64/runtime-meta.json \
            --app-version-code "$VC" \
            --key-id "$KEY_ID" \
            --out release/runtime-index.json
          python3 scripts/sign-runtime-index.py --key "$KEY" \
            --in release/runtime-index.json --out release/runtime-index.json.sig
          python3 scripts/sign-runtime-index.py --verify \
            --pubkey "$PUB" \
            --in release/runtime-index.json --sig release/runtime-index.json.sig
          python3 scripts/verify-runtime-index.py \
            --index release/runtime-index.json \
            --sig release/runtime-index.json.sig \
            --pubkey "$PUB" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --abi arm64-v8a --abi x86_64
          rm -f "$KEY" "$KS" "$PUB" "$CERT"
          ls -lh release/

      - name: 生成并签名 update-index.json（自动更新的哈希清单）
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          bash scripts/publish-update-index.sh --channel stable --tag "$GITHUB_REF_NAME" \
            --apk-dir apk --out-dir release \
            --notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

      - name: 生成发布说明
        env:
          APK_DIR: apk
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          HARDSSH_VERSION: ${{ env.HARDSSH_VERSION }}
        run: bash scripts/generate-release-notes.sh tag release-notes.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH Mobile ${{ github.ref_name }}
          files: |
            apk/*.apk
            release/*.zip
            release/*.json
            release/*.sig
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body_path: release-notes.md

      - name: 清理旧文件名的资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          API_BASE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/tags/${TAG_NAME}" | jq -r '.id')
          ASSETS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r '.[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -z "$asset_id" ] && continue
            if [ ! -f "apk/$asset_name" ] && [ ! -f "release/$asset_name" ]; then
              echo "remove stale asset: $asset_name (id=$asset_id)"
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${API_BASE_URL}/releases/assets/${asset_id}" >/dev/null
            fi
          done <<< "$ASSETS"

  # ---------------------------------------------------------------------------
  # Edge（每次 push main）：把最新 debug + release 发到 pre-release "edge"，
  # 用户不必等正式 tag 就能拿到包；tag v* 仍走上面的正式发布。
  # 只发布 main（避免 feature 分支覆盖 edge）；缺签名 secrets 时 release 构建
  # 会被跳过，本 job 直接失败并提示配置，避免发布「只有 debug」的半套。
  # ---------------------------------------------------------------------------
  publish-edge:
    if: >-
      (github.repository == 'Soodok/Deepseek-Harness-Local-Android' ||
       vars.ENABLE_CI_IN_FORK == 'true')
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.build-apk.result == 'success'
    needs: [build-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-android-apk-*-noruntime
          merge-multiple: true
          path: apk/

      - name: 确认 noruntime 双架构 × 双变体齐全
        run: |
          set -euo pipefail
          ls -lh apk/
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          REF="${GITHUB_REF_NAME//\//-}"
          for abi in arm64-v8a x86_64; do
            if [ "$REF" = "v$V" ]; then BASE="dsh-android-${REF}-${abi}"; else BASE="dsh-android-${REF}-${abi}-v${V}"; fi
            test -f "apk/${BASE}-debug-noruntime.apk"
            test -f "apk/${BASE}-release-noruntime.apk" || {
              echo "::error::missing signed noruntime release apk for $abi — configure RELEASE_* secrets (docs/RELEASE.md)"; exit 1; }
          done

      - name: 生成发布说明
        env:
          APK_DIR: apk
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          HARDSSH_VERSION: ${{ env.HARDSSH_VERSION }}
        run: bash scripts/generate-release-notes.sh edge edge-notes.md

      - name: 生成并签名 update-index.json（自动更新的哈希清单）
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          bash scripts/publish-update-index.sh --channel edge --tag edge \
            --apk-dir apk --out-dir release \
            --notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/edge"

      - name: 发布 edge 预发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: Edge · ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            apk/*.apk
            release/update-index.json
            release/update-index.json.sig
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: edge-notes.md

      - name: 清理旧文件名的资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: edge
        run: |
          set -euo pipefail
          API_BASE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/tags/${TAG_NAME}" | jq -r '.id')
          ASSETS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r '.[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -z "$asset_id" ] && continue
            if [ ! -f "apk/$asset_name" ] && [ ! -f "release/$asset_name" ]; then
              echo "remove stale asset: $asset_name (id=$asset_id)"
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${API_BASE_URL}/releases/assets/${asset_id}" >/dev/null
            fi
          done <<< "$ASSETS"

  # ---------------------------------------------------------------------------
  # v1.2.120：构建监视 —— 汇总两只 legs 的结果到 Step Summary，任一腿失败即整红。
  # 这样「构建挂了」不必逐 job 点开找：run 页面顶部就是一张表。
  # ---------------------------------------------------------------------------
  build-monitor:
    name: Build monitor (Zusammenfassung)
    needs: [build-hardssh, fetch-runtime, build-apk, publish-preview, publish-edge, publish-release]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Ergebnis-Tabelle
        run: |
          {
            echo "## Build-Monitor — ${{ github.workflow }} @ ${{ github.ref_name }} (${{ github.event_name }})"
            echo "| Leg | Ergebnis |"
            echo "|---|---|"
            echo "| build-hardssh (npm ${{ env.HARDSSH_VERSION }}) | ${{ needs.build-hardssh.result }} |"
            echo "| fetch-runtime (aarch64 + x86_64) | ${{ needs.fetch-runtime.result }} |"
            echo "| build-apk (arm64-v8a + x86_64) | ${{ needs.build-apk.result }} |"
            echo "| publish-preview (每日定时) | ${{ needs.publish-preview.result }} |"
            echo "| publish-release (tag v*) | ${{ needs.publish-release.result }} |"
            echo "| publish-edge (push main) | ${{ needs.publish-edge.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fehlschlag durchstellen
        if: needs.build-hardssh.result != 'success' || needs.fetch-runtime.result != 'success' || needs.build-apk.result != 'success' || needs.publish-preview.result == 'failure' || needs.publish-release.result == 'failure' || needs.publish-edge.result == 'failure'
        run: |
          echo "::error::Build leg failed (hardssh=${{ needs.build-hardssh.result }}, fetch-runtime=${{ needs.fetch-runtime.result }}, build-apk=${{ needs.build-apk.result }}, publish-release=${{ needs.publish-release.result }}, publish-edge=${{ needs.publish-edge.result }})"
          exit 1
