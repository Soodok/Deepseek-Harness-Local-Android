name: runtime-build

# runtime-build —— 滚动运行时通道（CI 构建源，与 App 端下载渠道无关）
#
# 背景（v1.4.27）：此前 android-build 的 collect-runtime 每次 push/PR/每日定时都
# 在 runner 上现场 apt 收集 Termux 闭包 + 打补丁 + 打包 127MB×2，耗时 5-10 分钟；
# 且 Termux 仓库浮动，同一 commit 两次构建 sha 可能不同（不可复现）。
# 现在 runtime 由本工作流按需构建，发布成滚动 prerelease tag "runtime"；
# android-build 的 fetch-runtime 按优先级取用（详见 docs/CI_RUNTIME_PIPELINE.md）。
#
# 何时重建（decide job 统一决策，可跳过）：
#   · workflow_dispatch         手动；默认查 prerelease，齐全且脚本指纹未变 → 跳过，
#                               force=true 强制重建
#   · push（runtime 脚本变更）  资产齐全 + 指纹一致 → 跳过（走复用分支）；
#                               缺失/指纹变化 → 补建（仅 main 分支发布）
#   · schedule（每月 1 日）     同 push，兜底 Termux 安全更新
#   · workflow_run              上游 upstream-staging 成功后，读其 artifact 拿 staged
#                               dsh 版本，与现役 runtime 的 engineVersion 比对，
#                               变了才重建（这正是「dsh_version 变化 → 自动重编」）
#
# 产物（5 个资产，overwrite 滚动更新）：
#   runtime-arm64-v8a.zip / runtime-x86_64.zip
#   runtime-meta-arm64-v8a.json / runtime-meta-x86_64.json
#   runtime-inputs.json（scriptsSha256 + dshVersion + builtAt，供 decide 比对）
#
# ⚠️ 本 release 必须 prerelease + make_latest:false：
#    GitHub /releases/latest 只认正式 release，这样不会劫持 App 端 noruntime
#    首启拉取 runtime-index.json 的既有渠道（AI_CONTEXT v1.4.20「不新增 runtime 渠道」）。
# ⚠️ tag "runtime" 不匹配 android-build 的 on.push.tags v*，不会自激刷包。

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "Upstream dsh version to embed"
        required: true
        default: "0.2.1-rc.5"
      force:
        description: "跳过资产/指纹检查，强制重建"
        type: boolean
        default: false
  push:
    branches: ["**"]
    paths:
      - "scripts/collect-termux-runtime.sh"
      - "scripts/build-runtime.sh"
      - "scripts/patch-*.py"
      - "scripts/dedupe-*.py"
      - "scripts/trim-runtime.py"
      - "scripts/make-lite-runtime.py"
      - "scripts/runtime-inputs-sha.py"
      - ".github/workflows/runtime-build.yml"
  schedule:
    # GitHub 的 cron 固定按 UTC：20:00 UTC = 次日 04:00 Asia/Shanghai
    - cron: "0 20 1 * *"
  workflow_run:
    workflows: [upstream-staging]
    types: [completed]

permissions:
  contents: write   # 发布滚动 runtime prerelease
  actions: read     # workflow_run 路径读取 upstream-staging 的 artifact

concurrency:
  group: runtime-build
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  DEFAULT_DSH_VERSION: "0.2.1-rc.5"

jobs:
  # ---------------------------------------------------------------------------
  # 决策：是否真的需要重建。所有触发都先过这里，结论写 Step Summary。
  # ---------------------------------------------------------------------------
  decide:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      dsh_version: ${{ steps.decide.outputs.dsh_version }}
      scripts_sha: ${{ steps.decide.outputs.scripts_sha }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算本地 runtime 脚本指纹
        id: local
        run: echo "sha=$(python3 scripts/runtime-inputs-sha.py .)" >> "$GITHUB_OUTPUT"

      - name: 决策是否重建
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_DSH: ${{ inputs.dsh_version }}
          INPUT_FORCE: ${{ inputs.force }}
          STAGING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STAGING_RUN_ID: ${{ github.event.workflow_run.id }}
          PUSH_REF: ${{ github.ref }}
          LOCAL_SHA: ${{ steps.local.outputs.sha }}
        run: |
          set -euo pipefail
          DSH="$DEFAULT_DSH_VERSION"
          BUILD=false
          PUBLISH=false
          REASON=""
          REL_SHA=""
          CUR_DSH=""

          api_release() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/runtime" "$@" 2>/dev/null || true
          }

          asset_url() {
            api_release --jq ".assets[] | select(.name==\"$1\") | .browser_download_url"
          }

          has_full_runtime() {
            local names
            names="$(api_release --jq '.assets[].name')"
            for a in runtime-arm64-v8a.zip runtime-x86_64.zip \
                     runtime-meta-arm64-v8a.json runtime-meta-x86_64.json; do
              printf '%s\n' "$names" | grep -qx "$a" || return 1
            done
            return 0
          }

          # 现役 runtime 的脚本指纹 / dsh 版本（无 runtime release 时为空）
          if URL="$(asset_url runtime-inputs.json)"; [ -n "$URL" ]; then
            REL_SHA="$(curl -fsSL "$URL" | jq -r '.scriptsSha256 // empty' || true)"
          fi
          if URL="$(asset_url runtime-meta-arm64-v8a.json)"; [ -n "$URL" ]; then
            CUR_DSH="$(curl -fsSL "$URL" | jq -r '.engineVersion // empty' || true)"
          fi

          scripts_changed() {
            # 无指纹（旧 release / 首次）按「已变化」处理，宁重建不漏发
            [ -z "$REL_SHA" ] || [ "$REL_SHA" != "$LOCAL_SHA" ]
          }

          case "$EVENT" in
            workflow_dispatch)
              if [ -n "$INPUT_DSH" ]; then DSH="$INPUT_DSH"; fi
              if [ "$INPUT_FORCE" = "true" ]; then
                BUILD=true; PUBLISH=true; REASON="手动强制重建（force）"
              elif ! has_full_runtime; then
                BUILD=true; PUBLISH=true; REASON="runtime prerelease 资产缺失 → 补建"
              elif scripts_changed; then
                BUILD=true; PUBLISH=true; REASON="runtime 脚本指纹变化（${REL_SHA:0:12}… → ${LOCAL_SHA:0:12}…）"
              else
                REASON="资产齐全且脚本指纹一致 → 跳过（如需重建请勾选 force）"
              fi
              ;;
            workflow_run)
              if [ "$STAGING_CONCLUSION" != "success" ]; then
                REASON="upstream-staging 结论 ${STAGING_CONCLUSION:-unknown} → 跳过"
              else
                ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}/artifacts" \
                  --jq '[.artifacts[] | select(.name=="upstream-dsh-version")][0].id' 2>/dev/null || true)"
                if [ -n "$ART_ID" ] && [ "$ART_ID" != "null" ]; then
                  gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/dsh-version.zip
                  STAGED="$(unzip -p /tmp/dsh-version.zip dsh_version.txt | head -1 | tr -d '[:space:]' || true)"
                  if [ -n "$STAGED" ]; then DSH="$STAGED"; fi
                else
                  echo "::notice::upstream-staging 未上传 upstream-dsh-version，回退默认 ${DSH}"
                fi
                if ! has_full_runtime; then
                  BUILD=true; PUBLISH=true; REASON="无 runtime prerelease → 按 staged dsh ${DSH} 补建"
                elif [ -z "$CUR_DSH" ]; then
                  BUILD=true; PUBLISH=true; REASON="现役 runtime 无 engineVersion → 按 staged dsh ${DSH} 重建"
                elif [ "$CUR_DSH" != "$DSH" ]; then
                  BUILD=true; PUBLISH=true; REASON="dsh 版本变化：${CUR_DSH} → ${DSH}"
                elif scripts_changed; then
                  BUILD=true; PUBLISH=true; REASON="dsh 一致（${DSH}）但脚本指纹变化 → 重建"
                else
                  REASON="dsh 版本未变（${DSH}）且脚本指纹一致 → 跳过"
                fi
              fi
              ;;
            *)
              # push / schedule：有就跳过走复用分支，没有就补建
              if has_full_runtime && ! scripts_changed; then
                REASON="runtime prerelease 齐全且脚本指纹一致 → 跳过（android-build 复用；改动验证请手动 dispatch + force）"
              elif has_full_runtime; then
                BUILD=true; REASON="runtime 脚本指纹变化（${REL_SHA:0:12}… → ${LOCAL_SHA:0:12}…）→ 重建"
                if [ "$PUSH_REF" = "refs/heads/main" ] || [ "$EVENT" = "schedule" ]; then
                  PUBLISH=true
                fi
              else
                BUILD=true; REASON="runtime prerelease 缺失 → 自动补建（${EVENT}）"
                if [ "$PUSH_REF" = "refs/heads/main" ] || [ "$EVENT" = "schedule" ]; then
                  PUBLISH=true
                fi
              fi
              ;;
          esac

          {
            echo "## runtime-build 决策"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 事件 | ${EVENT} |"
            echo "| 重建 | ${BUILD} |"
            echo "| 发布 | ${PUBLISH} |"
            echo "| dsh（现役 → 目标） | ${CUR_DSH:-none} → ${DSH} |"
            echo "| 脚本指纹（现役 → 本地） | ${REL_SHA:-none} → ${LOCAL_SHA} |"
            echo "| 原因 | ${REASON} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "dsh_version=$DSH" >> "$GITHUB_OUTPUT"
          echo "scripts_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "decision: build=$BUILD publish=$PUBLISH — $REASON"

  # ---------------------------------------------------------------------------
  # 构建：双架构（与 android-build 原来的 collect-runtime 完全同一套脚本与校验）
  # ---------------------------------------------------------------------------
  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
          - termux_arch: x86_64
            abi: x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 构建 runtime（${{ matrix.abi }} / dsh ${{ needs.decide.outputs.dsh_version }}）
        env:
          DSH_VERSION: ${{ needs.decide.outputs.dsh_version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt dpkg-dev zip unzip
          chmod +x scripts/collect-termux-runtime.sh scripts/build-runtime.sh
          ./scripts/build-runtime.sh --abi ${{ matrix.abi }} --out runtime.zip
          cp runtime.json runtime-meta.json

      - name: 校验运行时命令闭包 + 补丁门禁（${{ matrix.abi }}）
        run: |
          rm -rf runtime-check && mkdir runtime-check
          unzip -q runtime.zip -d runtime-check
          test -x runtime-check/bin/bash
          test -x runtime-check/bin/rg
          # SONAME 精确文件名（Android linker 按 NEEDED 逐字查找）
          for so in libreadline.so.8 libhistory.so.8 libncursesw.so.6 libncurses.so.6 \
                    libiconv.so libpcre2-8.so; do
            test -e "runtime-check/lib/$so" || { echo "::error::SONAME 库 lib/$so 缺失"; exit 1; }
          done
          test -x runtime-check/bin/pnpm
          test -x runtime-check/bin/curl
          test -e runtime-check/usr/bin/.keep
          case "${{ matrix.termux_arch }}" in
            aarch64) NA=arm64 ;; x86_64) NA=x64 ;;
          esac
          test -x "runtime-check/lib/node_modules/@vscode/ripgrep-android-$NA/bin/rg" \
            || { echo "::error::ripgrep 平台包缺失"; exit 1; }
          if find runtime-check -type f -path '*@vscode/ripgrep-linux-*/*/rg' -print -quit | grep -q .; then
            echo "::error::runtime 混入宿主 Linux ripgrep"
            exit 1
          fi
          if [ -e "runtime-check/lib/node_modules/@xiaopb/dsh-hardssh" ]; then
            echo "::error::runtime.zip 不应包含 @xiaopb/dsh-hardssh（已解耦到 APK 内置目录）"
            exit 1
          fi
          echo "bash/rg/SONAME/wrapper runtime closure OK（hardssh 已解耦）"

      # ---------------------------------------------------------------------
      # v1.4.36：把 app/build.gradle.kts 的两道打包门禁前移到发布之前。
      #
      # 之前这里只验命令闭包，PTC 补丁 / WebView polyfill 只在 APK 打包时才验。
      # 后果：patch 脚本回归 → runtime-build 全绿发布 → 所有 android-build 在
      # prepareRuntimeAssets 挂掉，而且要先吞掉 128MB 下载 + 解包才看到错误。
      # 现在坏包在源头就被挡住，滚动 tag 里不会再出现「打包必挂」的运行时。
      # 断言必须与 build.gradle.kts 的 ptcOk / polyOk 保持逐字一致。
      # ---------------------------------------------------------------------
      - name: 校验 PTC 补丁与 WebView polyfill（${{ matrix.abi }}）
        run: |
          set -euo pipefail
          PTC=runtime-check/lib/node_modules/@deepseek-ai/dsh-ptc-runtime-node/lib/index.js
          test -f "$PTC" || { echo "::error::PTC runtime 产物缺失：$PTC"; exit 1; }
          for m in '"LD_LIBRARY_PATH"' \
                   'Inject the runtime library path unconditionally' \
                   'OPENSSL_CONF' \
                   'SSL_CERT_FILE' \
                   '"MAGICK_CONFIGURE_PATH"' \
                   '[dsh-android] bootstrap path fallback'; do
            grep -qF "$m" "$PTC" \
              || { echo "::error::PTC 补丁标记缺失：$m（scripts/patch-ptc-runtime-android.py 回归？）"; exit 1; }
          done
          POLY=runtime-check/lib/node_modules/@deepseek-ai/dsh-web-frontend/dist/index.html
          test -f "$POLY" || { echo "::error::web frontend 产物缺失：$POLY"; exit 1; }
          for m in 'legacy-webview polyfill v4' 'throwIfAborted' 'AbortSignal.any' 'Promise.withResolvers'; do
            grep -qF "$m" "$POLY" \
              || { echo "::error::WebView polyfill v4 标记缺失：$m"; exit 1; }
          done
          echo "PTC patch（含 bootstrap path fallback）+ WebView polyfill v4 OK"

      # ---------------------------------------------------------------------
      # v1.4.36：去重内容门禁（承接 _test_runtime_dedupe.py 第 2 节）。
      #
      # 该探针第 2 节要「打开真实 runtime.zip 看内容」，属于产物质量，本不该在
      # i18n-check 这种轻量 check 里跑——CI 干净检出下三处源都不存在，把这种
      # 必然出现的正常态判成失败是错的。因此探针里改为无产物时 SKIP，把去重
      # 内容的产物级校验归位到此处（runtime 刚造出来、准备发布的那一刻）。
      # 这里的断言与探针第 2 节逐字对应，发布出去的包必过这一票。
      # ---------------------------------------------------------------------
      - name: 校验运行时去重内容（${{ matrix.abi }}）
        run: |
          set -euo pipefail
          # 无嵌套 zod 副本（除顶层 lib/node_modules/zod/ 外，任何包内不应再嵌 zod）
          NESTED=$(unzip -Z1 runtime.zip | grep -F '/node_modules/zod/' | grep -v '^lib/node_modules/zod/' || true)
          [ -z "$NESTED" ] || { echo "::error::发现嵌套 zod 副本（去重失效）："; echo "$NESTED"; exit 1; }
          # 文件数降到去重后量级（去重前约 45000）
          N=$(unzip -Z1 runtime.zip | grep -vc '/$')
          echo "文件数=$N"
          [ "$N" -lt 20000 ] || { echo "::error::文件数 $N 未降到去重后量级"; exit 1; }
          # 顶层 zod 仍在
          unzip -Z1 runtime.zip | grep -q '^lib/node_modules/zod/package.json$' \
            || { echo "::error::顶层 zod 缺失"; exit 1; }
          # 10 个完整性锚点全在
          for a in \
            lib/node_modules/@deepseek-ai/dsh/lib/bin.js \
            lib/node_modules/@deepseek-ai/cordis/lib/index.js \
            lib/node_modules/@deepseek-ai/dsh-base/cordis.patch.yml \
            lib/node_modules/@deepseek-ai/dsh-web-app/cordis.patch.yml \
            lib/node_modules/@deepseek-ai/dsh-client-ui-chat/lib/client.js \
            lib/libreadline.so.8 \
            lib/libz.so.1 \
            bin/node \
            bin/bash \
            bin/rg; do
            unzip -Z1 runtime.zip | grep -q "^$a\$" \
              || { echo "::error::完整性锚点缺失：$a"; exit 1; }
          done
          # corepack 不能被去重/裁剪破坏
          CP_HEAD=$(unzip -p runtime.zip lib/node_modules/corepack/dist/corepack.js 2>/dev/null | head -c 40)
          [ -n "$CP_HEAD" ] || { echo "::error::corepack.js 缺失"; exit 1; }
          case "$CP_HEAD" in
            /system/bin/sh*) echo "::error::corepack.js 被覆盖为非 JS 入口"; exit 1 ;;
          esac
          echo "去重内容 OK（无嵌套 zod / 10 锚点 / corepack 完好 / 文件数=$N）"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: |
            runtime.zip
            runtime-meta.json
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-meta-${{ matrix.abi }}
          path: runtime-meta.json
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 发布：滚动更新 prerelease tag "runtime"（同 tag 覆盖资产，只保留最新一版）
  # ---------------------------------------------------------------------------
  publish:
    needs: [decide, build]
    if: needs.decide.outputs.build == 'true' && needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: dist

      - name: 整理发布资产（按 ABI 重命名）
        run: |
          set -euo pipefail
          mkdir -p release
          for abi in arm64-v8a x86_64; do
            cp "dist/runtime-${abi}/runtime.zip" "release/runtime-${abi}.zip"
            cp "dist/runtime-meta-${abi}/runtime-meta.json" "release/runtime-meta-${abi}.json"
          done
          ls -lh release/

      - name: 写入脚本指纹（供下次 decide 比对）
        env:
          SCRIPTS_SHA: ${{ needs.decide.outputs.scripts_sha }}
          DSH: ${{ needs.decide.outputs.dsh_version }}
        run: |
          set -euo pipefail
          jq -n --arg s "$SCRIPTS_SHA" --arg d "$DSH" \
            --arg t "$(date -u +%FT%TZ)" --arg r "$GITHUB_REPOSITORY" \
            '{scriptsSha256:$s, dshVersion:$d, builtAt:$t, repo:$r}' \
            > release/runtime-inputs.json
          cat release/runtime-inputs.json

      - name: 生成发布说明
        run: |
          set -euo pipefail
          {
            echo "滚动运行时预构建（CI 构建源 · prerelease · 不进 /releases/latest）"
            echo ""
            echo "| ABI | runtime 版本 | dsh | sha256 | zip 体积 |"
            echo "|---|---|---|---|---|"
            for abi in arm64-v8a x86_64; do
              jq -r '"| \(.abi) | \(.version) | \(.engineVersion) | \(.sha256[0:12])… | \((.size/1048576*10|round)/10) MB |"' \
                "release/runtime-meta-${abi}.json"
            done
            echo ""
            echo "- 脚本指纹 \`${{ needs.decide.outputs.scripts_sha }}\`"
            echo "- 决策原因：${{ needs.decide.outputs.reason }}"
            echo ""
            echo "android-build 的 fetch-runtime 优先取本 release；缺失时回退 releases/latest，再缺失则本地兜底构建。"
          } > body.md
          cat body.md

      - name: 发布滚动 runtime prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime
          name: Runtime · dsh ${{ needs.decide.outputs.dsh_version }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body_path: body.md
          files: |
            release/runtime-arm64-v8a.zip
            release/runtime-x86_64.zip
            release/runtime-meta-arm64-v8a.json
            release/runtime-meta-x86_64.json
            release/runtime-inputs.json

      - name: 清理旧文件名的资产（只保留最新一版）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: runtime
        run: |
          set -euo pipefail
          API_BASE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/tags/${TAG_NAME}" | jq -r '.id')
          ASSETS=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${API_BASE_URL}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r '.[] | [.id, .name] | @tsv')
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -z "$asset_id" ] && continue
            if [ ! -f "release/$asset_name" ]; then
              echo "remove stale asset: $asset_name (id=$asset_id)"
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${API_BASE_URL}/releases/assets/${asset_id}" >/dev/null
            fi
          done <<< "$ASSETS"
