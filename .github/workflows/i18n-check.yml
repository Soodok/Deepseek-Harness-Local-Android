name: i18n-check

# Translation guard rails for the Android app.
#
# The app ships English as the DEFAULT locale (res/values/strings.xml) and
# translates into German (res/values-de/) and Simplified Chinese
# (res/values-zh-rCN/). This workflow fails the PR if Chinese leaks back into
# the default locale, into layout literals or into Kotlin string literals, and
# if a locale drifts apart from the base one (missing keys or mismatched format
# placeholders such as %1$s / %2$d).
#
# It needs no Android SDK and runs in seconds, so it can gate every PR cheaply.

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Translation & locale consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run i18n checks
        run: python3 scripts/check-i18n.py

      # ── UI token 门禁（v1.5.6）───────────────────────────────────────
      # 把设计约定变成会红的检查：间距只许出现基线值且新增必须是 8 的倍数、
      # 字号档位只减不增、颜色字面量按文件只许减少，外加四个视觉基线锚点
      # （卡片描边 / 分组圆角描边 / MD3 语义色回映射 / DynamicColors 门控）。
      # 纯文本分析，不用 Android SDK。
      - name: Run UI token checks
        run: python3 scripts/check-ui-tokens.py

      # ── 回归探针（v1.4.32）─────────────────────────────────────────────
      # 这些探针是「行为契约的守卫」，每个都对应一次真实事故（见
      # docs/git-workflow.md）。纯文本分析，不需要 Android SDK，几秒跑完，
      # 放在这个轻量 workflow 里门禁每个 PR —— 比等主构建挂掉反馈快得多。
      #
      # _test_corepack_hardlink.py 例外：它读 app/src/main/assets/runtime.zip，
      # 而该文件已按 PR #48 架构移到构建产物目录（不在仓库里）。探针待更新，
      # 这里显式跳过，避免长期红着掩盖真正的回归。
      - name: Run regression probes
        run: |
          set -uo pipefail
          fail=0
          for f in scripts/probes/_test_*.py; do
            case "$f" in
              *corepack_hardlink*) echo "SKIP  $f (pending update, see comments)"; continue;;
            esac
            if out=$(python3 "$f" 2>&1); then
              echo "PASS  $f"
            else
              echo "FAIL  $f"
              echo "$out" | tail -25
              fail=1
            fi
          done
          exit $fail

      # ── git 卫生（v1.4.32）───────────────────────────────────────────
      # 挡住三类历史事故：工作区脏着推、远端有新提交却直接推（会覆盖别人）、
      # 对象库里混入 CRLF（CI 上 shell 脚本变成 bad interpreter）。
      # --ci 模式不做网络操作、不因「工作区脏」报警（CI 检出本身就是干净的）。
      - name: git hygiene
        run: python3 scripts/git-hygiene.py --ci

      - name: Upload full report on failure
        if: failure()
        run: python3 scripts/check-i18n.py 2>&1 | tee i18n-report.txt || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: i18n-report
          path: i18n-report.txt
          retention-days: 7
