<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH · 自然配色与共享会话</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f1ec;color:#29322f;font:15px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px 20px}h1{font-size:24px;font-weight:600;letter-spacing:-.5px;margin:0 0 8px}p{color:#65706a;margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,a{color:inherit}button{min-height:44px;padding:8px 16px;border:1px solid #d2d9d2;border-radius:22px;background:#fff9;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#375e50;color:white;border-color:#375e50}figure{margin:20px 0;display:flex;flex-direction:column;align-items:center;gap:12px}img{max-width:100%;height:auto;border-radius:26px;border:1px solid #bfcac3;box-shadow:0 16px 46px #24372c0c}figcaption,footer{font-size:13px;color:#65706a}.palette{margin:20px 0 8px}footer{max-width:780px;border-top:1px solid #d2d9d2;padding-top:16px}.proof{display:flex;gap:18px;flex-wrap:wrap}a{text-underline-offset:3px}</style><main><h1>自然配色与共享会话</h1><p>雾灰、暖砂、鼠尾草、暮紫，各有深浅两套。玻璃只留在悬浮栏和输入区，主会话与子会话共用消息和工具展示。</p><div id="palettes" class="palette"></div><nav id="appearance" aria-label="深浅模式"></nav><nav id="scenes" aria-label="页面场景"></nav><figure><img id="screen" width="432" height="960" alt="实际Flutter页面"><figcaption id="caption"></figcaption></figure><footer><div class="proof"><a id="compare" href="natural-palettes.png">八套配色对照</a><a id="manifest" href="manifest.json">截图与构建记录</a></div><p>实际Flutter构建和点击后的画面，内容为标注的演示数据。配色切换保留会话和草稿；标题仅在超出宽度时滚动。页面截图不代表Android真机或在线引擎已验收。</p></footer></main><script>
const palettes=[['mist','雾灰'],['sand','暖砂'],['sage','鼠尾草'],['plum','暮紫']];let mood='mist',light=true,scene='main';const img=document.querySelector('#screen');const buttons=[];function add(container,id,label,run){const b=document.createElement('button');b.textContent=label;b.dataset.choice=id;b.onclick=()=>{run();paint()};document.querySelector(container).append(b);buttons.push(b)}for(const[id,label]of palettes)add('#palettes','mood-'+id,label,()=>{mood=id;scene='main'});add('#appearance','light','浅色',()=>{light=true;scene='main'});add('#appearance','dark','深色',()=>{light=false;scene='main'});for(const[id,label]of [['main','主会话'],['process','执行过程'],['child','子会话'],['title','溢出标题']])add('#scenes','scene-'+id,label,()=>scene=id);function paint(){let file;if(scene==='main')file='natural-'+mood+'-'+(light?'light':'dark')+'.png';if(scene==='process')file=light?'natural-process-light.png':'natural-process-dark.png';if(scene==='child')file=light?'natural-child-light.png':'natural-child-dark-360.png';if(scene==='title')file='natural-title-after.png';img.src=file+location.search;img.width=file.includes('360')?360:432;document.querySelector('#caption').textContent=(scene==='main'?palettes.find(x=>x[0]===mood)[1]+' · '+(light?'浅色':'深色'):scene==='child'?'子会话 · 实际进入并发送':scene==='title'?'溢出标题 · 滚动后的画面':'展开执行过程');for(const b of buttons)b.setAttribute('aria-pressed',String(b.dataset.choice==='mood-'+mood||b.dataset.choice===(light?'light':'dark')||b.dataset.choice==='scene-'+scene));}for(const id of ['compare','manifest'])document.querySelector('#'+id).href+=location.search;paint();</script></html>
