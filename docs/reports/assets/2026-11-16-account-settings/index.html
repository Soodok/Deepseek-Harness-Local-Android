<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH · 账号与新版设置</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#242e2c;font:15px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 20px}h1{font-size:24px;margin:0 0 8px}p{color:#4d5e59}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;min-height:48px;background:white;color:#356b59;border:1px solid #c9d1cc;border-radius:16px;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#356b59;color:white}.stage{display:flex;justify-content:center}img{max-width:100%;height:auto;border-radius:24px;border:1px solid #c9d1cc}footer{font-size:13px;color:#52665e;margin-top:24px;max-width:760px}</style><main><h1>DSH · 账号与新版设置</h1><p>MIUI 分组设置、DeepSeek 个人资料、12 周 Token 格点和独立主题页。以下画面通过实际 Flutter 页面点击获取。</p><nav id="tabs"></nav><div class="stage"><img id="screen" width="432" height="960" alt="实际 Flutter 设置页面"></div><footer>beta.30 / code405 · Web release 构建成功。账号资料和用量为明确标注的演示数据；原生实现使用 DSH Host 账号协议，本地统计有覆盖上限且不是官方账号账单。Android APK、真机和真实在线授权未验收。主题选择目前在本次运行内生效。</footer></main><script>const options=[['settings-home-light.png','浅色主页'],['settings-home-dark.png','深色主页'],['settings-list-light.png','分组设置'],['settings-account-menu.png','账号菜单'],['settings-theme-light.png','主题配置'],['settings-model-dark.png','模型配置'],['settings-home-360.png','360 窄屏'],['settings-daily-light.png','每日明细']];for(const[file,label]of options){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed','false');b.onclick=()=>{for(const n of document.querySelectorAll('button'))n.setAttribute('aria-pressed',String(n===b));const img=document.querySelector('#screen');img.src=file+location.search;img.alt=label+' · 实际Flutter';img.width=file.includes('360')?360:432;};document.querySelector('#tabs').append(b);}document.querySelector('button').click();</script></html>
