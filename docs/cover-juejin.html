<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    position: relative;
    background: #0a0e14;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e6edf3;
  }
  /* 蓝图网格 */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(64,140,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(64,140,255,0.055) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* 角落电蓝辉光 */
  .glow-tl { position: absolute; width: 560px; height: 560px; left: -180px; top: -180px;
    background: radial-gradient(circle, rgba(59,130,246,0.16), transparent 65%); }
  .glow-br { position: absolute; width: 640px; height: 640px; right: -200px; bottom: -240px;
    background: radial-gradient(circle, rgba(16,185,129,0.10), transparent 65%); }

  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; }

  /* ---- 左栏 ---- */
  .left { width: 62%; display: flex; flex-direction: column; justify-content: center; }
  .tags { display: flex; gap: 12px; margin-bottom: 30px; }
  .tag {
    font-family: Consolas, monospace; font-size: 17px; letter-spacing: 1px;
    padding: 6px 14px; border: 1px solid rgba(59,130,246,0.45); border-radius: 4px;
    color: #5aa2ff; background: rgba(59,130,246,0.08);
  }
  .tag.green { border-color: rgba(16,185,129,0.5); color: #34d399; background: rgba(16,185,129,0.08); }
  h1 { font-size: 68px; font-weight: 800; line-height: 1.22; letter-spacing: 1px; }
  h1 .hl { color: #4d9aff; }
  .num {
    font-family: Consolas, monospace; font-weight: 800;
    color: #4d9aff; text-shadow: 0 0 24px rgba(77,154,255,0.45);
  }
  .sub {
    margin-top: 28px; font-size: 24px; color: #8b949e;
    font-family: Consolas, "Microsoft YaHei", monospace; letter-spacing: 0.5px;
  }
  .sub b { color: #34d399; font-weight: 600; }
  .cmd {
    margin-top: 44px; font-family: Consolas, monospace; font-size: 20px;
    color: #7ee2b8; background: #0d1117; border: 1px solid #1f2937; border-radius: 8px;
    padding: 16px 22px; width: fit-content;
  }
  .cmd .p { color: #4d9aff; }

  /* ---- 右栏 ---- */
  .right { width: 40%; position: relative; }
  .whale {
    position: absolute; top: 72px; right: 36px; width: 320px;
    filter: drop-shadow(0 0 26px rgba(77,154,255,0.35));
  }
  .term {
    position: absolute; left: 0; bottom: 6px; width: 388px;
    background: #0d1117; border: 1px solid #21262d; border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    font-family: Consolas, monospace; font-size: 15px; line-height: 1.75;
    overflow: hidden;
  }
  .term .bar {
    display: flex; gap: 7px; align-items: center; height: 36px; padding: 0 14px;
    background: #161b22; border-bottom: 1px solid #21262d;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .d1 { background: #ff5f57; } .d2 { background: #febc2e; } .d3 { background: #28c840; }
  .term .title { margin-left: 8px; color: #6e7681; font-size: 13.5px; }
  .term .body { padding: 14px 18px; }
  .g { color: #34d399; } .b { color: #5aa2ff; } .gy { color: #8b949e; }
</style>
